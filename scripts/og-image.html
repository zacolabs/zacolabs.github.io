<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#0a0a0a;color:#f4f4f5;overflow:hidden;
 font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{position:relative;display:flex;align-items:center;justify-content:center}
.glow{position:absolute;left:150px;top:-135px;width:900px;height:900px;
 background:radial-gradient(circle at center,rgba(255,255,255,.09),rgba(255,255,255,0) 60%)}
.brand{display:flex;align-items:center;gap:44px;position:relative}
.brand img{width:190px;height:190px;border-radius:50%;border:1px solid #232326}
.brand b{font-size:128px;font-weight:700;letter-spacing:-.03em}
</style></head><body>
<div class="glow"></div>
<div class="brand"><img src="../zacolabs-assets/logo.png"><b>Zaco Labs</b></div>
</body></html>
